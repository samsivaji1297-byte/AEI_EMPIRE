<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>30‑Day Identity Rebuild — FinalMindset</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01040C; /* deep near-black blue */
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   AESTHETIC LAYER — RECONSTRUCTION CHAMBER V2
   --------------------------------------------------------- */

/* Base deep gradient */
.bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, #031226 0%, #020A18 40%, #01040C 100%);
  z-index:1;
}

/* Vertical blue wash */
.wash{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(0,120,255,0.22), transparent 65%),
    radial-gradient(ellipse at 50% 80%, rgba(0,120,255,0.16), transparent 70%);
  filter:blur(120px);
  opacity:0.55;
  animation:washDrift 48s ease-in-out infinite alternate;
  z-index:2;
}

@keyframes washDrift{
  from{transform:translateY(-30px);}
  to{transform:translateY(30px);}
}

/* Diagonal ambient glow */
.ambient{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 30%, rgba(0,150,255,0.12), transparent 70%),
    radial-gradient(circle at 20% 70%, rgba(0,150,255,0.10), transparent 75%);
  filter:blur(140px);
  opacity:0.45;
  animation:ambientShift 60s ease-in-out infinite alternate;
  z-index:3;
}

@keyframes ambientShift{
  from{transform:translateX(20px);}
  to{transform:translateX(-20px);}
}

/* Depth shimmer (very subtle) */
.shimmer{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0.03) 1px,
      transparent 1px),
    linear-gradient(90deg,
      rgba(0,150,255,0.05) 1px,
      transparent 1px);
  background-size: 2px 100%, 4px 100%;
  opacity:0.04;
  animation:shimmerShift 80s linear infinite;
  z-index:4;
}

@keyframes shimmerShift{
  from{transform:translateX(0);}
  to{transform:translateX(-80px);}
}

/* Subtle noise */
.noise{
  position:absolute;
  inset:0;
  opacity:.03;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
  z-index:5;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM — SINGLE EXAMPLE
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:12vh;
  padding-bottom:12vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  z-index:10;
}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(20px,4vw,30px);
  line-height:1.32;
  color:rgba(255,255,255,.78);
  max-width:92%;
  margin-top:6px;
  text-wrap:balance;
}

/* ---------------------------------------------------------
   BRAND BAR
   --------------------------------------------------------- */

.brand-bar{
  position:absolute;
  top:3vh;
  left:4vw;
  padding:6px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);

  box-shadow:
    0 0 12px rgba(255,255,255,.04),
    inset 0 0 8px rgba(255,255,255,.03);

  opacity:.42;
  z-index:20;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="wash"></div>
<div class="ambient"></div>
<div class="shimmer"></div>
<div class="noise"></div>

<div class="brand-bar">FINALMINDSET</div>

<!-- Example Slide -->
<div class="slide">
  <div class="s1">Rebuild your identity in the next 30 days.</div>
  <div class="s2">This is the chapter where your structure becomes unbreakable.</div>
</div>

</body>
</html>
