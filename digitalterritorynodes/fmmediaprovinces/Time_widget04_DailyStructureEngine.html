<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Time Compressed Province - Widget 3 - Daily Structure Engine - FinalMindset</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   AESTHETIC - PROTOCOL ROOM (Minimal, Clean)
   --------------------------------------------------------- */

.bg{
  position:absolute;
  inset:0;
  background:#020202;
  z-index:1;
}

.noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
  z-index:2;
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  opacity:.04;
  z-index:3;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM - SIMPLE SOVEREIGN PROTOCOL
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:12vh;
  padding-bottom:12vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
  z-index:10;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

.s1{
  font-size:clamp(34px,7vw,72px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(20px,4vw,30px);
  line-height:1.32;
  color:rgba(255,255,255,.78);
  max-width:92%;
  margin-top:6px;
  text-wrap:balance;
}

.cta{
  font-size:clamp(28px,6vw,44px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:20;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:30;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* ---------------------------------------------------------
   BRAND BAR
   --------------------------------------------------------- */

.brand-bar{
  position:absolute;
  top:3vh;
  left:4vw;
  padding:6px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);

  box-shadow:
    0 0 12px rgba(255,255,255,.04),
    inset 0 0 8px rgba(255,255,255,.03);

  opacity:.42;
  z-index:40;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="noise"></div>
<div class="grid"></div>

<div class="brand-bar">FINALMINDSET</div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   WIDGET 04 - DAILY STRUCTURE ENGINE
   --------------------------------------------------------- */

const protocol = {
  actions: [
    "Sleep like someone rebuilding their future.",
    "Eat in a way that stabilises your identity.",
    "Move daily to anchor your discipline.",
    "Create something small - momentum compounds.",
    "Reduce noise - clarity requires space.",
    "Protect your mornings - they shape your identity.",
    "Limit inputs - your mind needs bandwidth.",
    "Clean your environment - structure breeds structure.",
    "Track nothing - rebuild your system, not your metrics.",
    "Do one hard thing - identity strengthens under pressure."
  ],

  explanations: [
    "Your body is the foundation of your identity.",
    "Stability comes from consistency, not intensity.",
    "Your environment dictates your behaviour.",
    "Small wins compound into structural change.",
    "Clarity requires removing what drains you.",
    "Your mornings determine your trajectory.",
    "Bandwidth is your most valuable resource.",
    "A clean space creates a clean mind.",
    "Rebuild the system before you optimise it.",
    "Discomfort is the fastest way to identity growth."
  ]
};

const ctas = [
  "Save this protocol.",
  "Run this daily.",
  "Share this with someone rebuilding their structure.",
  "Your future self will thank you for saving this."
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function buildSlides(){
  const slides = [];

  for(let i=0; i<4; i++){
    slides.push({
      type:"pair",
      s1:pick(protocol.actions),
      s2:pick(protocol.explanations)
    });
  }

  slides.push({ type:"cta", text:pick(ctas) });

  return slides;
}

const slidesContainer = document.getElementById("slides");
const navDots = document.getElementById("navDots");
let index = 0;
let currentSlides = buildSlides();

function render(){
  slidesContainer.innerHTML = "";
  navDots.innerHTML = "";

  currentSlides.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "slide" + (i===index ? " active" : "");

    if(s.type === "pair"){
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
      `;
    } else {
      el.innerHTML = `<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot = document.createElement("div");
    dot.className = "dot" + (i===index ? " active" : "");
    navDots.appendChild(dot);
  });
}

function next(){
  index = (index + 1) % currentSlides.length;
  render();
}

function prev(){
  index = (index - 1 + currentSlides.length) % currentSlides.length;
  render();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

render();
</script>

</body>
</html>
