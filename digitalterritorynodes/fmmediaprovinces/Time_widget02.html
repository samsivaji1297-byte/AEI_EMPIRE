<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Time Compressed Province - Widget 2 - 14‑Day Life Splitter</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   AESTHETIC LAYER - LIFE SPLITTER VARIANT
   Slightly darker, sharper, more contrast.
   --------------------------------------------------------- */

.bg{
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.07),transparent 60%),
    radial-gradient(circle at 80% 100%,rgba(255,255,255,.05),transparent 60%),
    linear-gradient(180deg,#010101,#000);
  filter:blur(90px);
  opacity:0.88;
  animation:drift 36s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.25) translate(-70px,-120px);}
}

.fog{
  position:absolute;
  inset:-12%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.05),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;
  opacity:0.17;
  filter:blur(28px);
  animation:fogShift 44s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes fogShift{
  from{transform:translate3d(-14px,14px,0) scale(1);}
  to{transform:translate3d(24px,-24px,0) scale(1.12);}
}

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:3px 3px, 5px 5px;
  opacity:.06;
  animation:particleDrift 64s linear infinite;
}

@keyframes particleDrift{
  from{transform:translate(0,0);}
  to{transform:translate(-140px,-100px);}
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  mix-blend-mode:overlay;
  opacity:.05;
  animation:gridPulse 16s ease-in-out infinite alternate;
}

@keyframes gridPulse{
  from{opacity:.03;}
  to{opacity:.075;}
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.035),transparent);
  backdrop-filter:blur(20px);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM - DUAL LINE
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:11vh;
  padding-bottom:11vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(20px,4vw,30px);
  line-height:1.32;
  color:rgba(255,255,255,.78);
  max-width:92%;
  margin-top:6px;
  text-wrap:balance;
}

.cta{
  font-size:clamp(28px,6vw,44px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* ---------------------------------------------------------
   BRAND BAR
   --------------------------------------------------------- */

.brand-bar{
  position:absolute;
  top:3vh;
  left:4vw;
  padding:6px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);

  box-shadow:
    0 0 12px rgba(255,255,255,.04),
    inset 0 0 8px rgba(255,255,255,.03);

  opacity:.42;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>
<div class="particles"></div>
<div class="grid"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div class="brand-bar">FINALMINDSET</div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   WIDGET 02 - 14‑DAY LIFE SPLITTER ENGINE
   --------------------------------------------------------- */

const categories = {
  lifeSplit: {
    hooks: [
      "Your life splits in the next 14 days.",
      "Give yourself 14 days - everything changes.",
      "The next 14 days will rewrite your identity.",
      "Your 14‑day rupture begins now.",
      "Run the 14‑day life‑split protocol."
    ],

    punches: [
      "You’re not stuck - you’re overdue for a rupture.",
      "You’re not behind - you’re living in an expired identity.",
      "You’re not lost - you’re outgrowing your old self.",
      "You’re not unmotivated - you’re misaligned with your next chapter.",
      "You’re not failing - you’re shedding."
    ],

    tensions: [
      "Your old identity can’t carry you into the next phase.",
      "Your environment is built for a version of you that no longer exists.",
      "Your habits belong to a life you’ve already outgrown.",
      "Your clarity is collapsing under outdated structures.",
      "Your potential is suffocating inside your current routine."
    ],

    collapses: [
      "Let the old identity die - the new one activates instantly.",
      "Cut the expired version of you - momentum returns.",
      "Shift your structure - your future self appears.",
      "Break the loop - the next chapter opens.",
      "Release the old life - the new one forms in 14 days."
    ]
  }
};

/* CTAs - Viral Loops */
const ctas = [
  "Save this for your 14‑day life split.",
  "Share this with someone entering their next chapter.",
  "Read this again tonight - it’ll hit harder.",
  "If you’re reading this, your rupture has already begun.",
  "Your future self will remember this moment."
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function pickCategory(){
  return categories.lifeSplit;
}

function buildSlides(){
  const cat = pickCategory();
  const hook = pick(cat.hooks);
  const punch = pick(cat.punches);
  const tension = pick(cat.tensions);
  const collapse = pick(cat.collapses);
  const cta = pick(ctas);

  return [
    { type:"pair", s1:hook, s2:"" },
    { type:"pair", s1:punch, s2:"Your system is trying to evolve while your environment keeps you frozen." },
    { type:"pair", s1:tension, s2:"You’re trying to grow inside a structure built for your past." },
    { type:"pair", s1:collapse, s2:"The split happens the moment you stop negotiating with who you used to be." },
    { type:"cta", text:cta }
  ];
}

/* Render engine */
const slidesContainer = document.getElementById("slides");
const navDots = document.getElementById("navDots");
let index = 0;
let currentSlides = buildSlides();

function render(){
  slidesContainer.innerHTML = "";
  navDots.innerHTML = "";

  currentSlides.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "slide" + (i===index ? " active" : "");

    if(s.type === "pair"){
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        ${s.s2 ? `<div class="s2">${s.s2}</div>` : ""}
      `;
    } else {
      el.innerHTML = `<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot = document.createElement("div");
    dot.className = "dot" + (i===index ? " active" : "");
    navDots.appendChild(dot);
  });
}

function next(){
  index = (index + 1) % currentSlides.length;
  render();
}

function prev(){
  index = (index - 1 + currentSlides.length) % currentSlides.length;
  render();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

render();
</script>

</body>
</html>
