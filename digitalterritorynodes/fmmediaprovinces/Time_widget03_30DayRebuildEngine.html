<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Time Compressed Province - Widget 3 - 30‑Day Identity Rebuild - FinalMindset</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01040C; /* deep near-black blue */
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   AESTHETIC LAYER - RECONSTRUCTION CHAMBER V2
   --------------------------------------------------------- */

/* Base deep gradient */
.bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, #031226 0%, #020A18 40%, #01040C 100%);
  z-index:1;
}

/* Vertical blue wash */
.wash{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(0,120,255,0.22), transparent 65%),
    radial-gradient(ellipse at 50% 80%, rgba(0,120,255,0.16), transparent 70%);
  filter:blur(120px);
  opacity:0.55;
  animation:washDrift 48s ease-in-out infinite alternate;
  z-index:2;
}

@keyframes washDrift{
  from{transform:translateY(-30px);}
  to{transform:translateY(30px);}
}

/* Diagonal ambient glow */
.ambient{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 30%, rgba(0,150,255,0.12), transparent 70%),
    radial-gradient(circle at 20% 70%, rgba(0,150,255,0.10), transparent 75%);
  filter:blur(140px);
  opacity:0.45;
  animation:ambientShift 60s ease-in-out infinite alternate;
  z-index:3;
}

@keyframes ambientShift{
  from{transform:translateX(20px);}
  to{transform:translateX(-20px);}
}

/* Depth shimmer (very subtle) */
.shimmer{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0.03) 1px,
      transparent 1px),
    linear-gradient(90deg,
      rgba(0,150,255,0.05) 1px,
      transparent 1px);
  background-size: 2px 100%, 4px 100%;
  opacity:0.04;
  animation:shimmerShift 80s linear infinite;
  z-index:4;
}

@keyframes shimmerShift{
  from{transform:translateX(0);}
  to{transform:translateX(-80px);}
}

/* Subtle noise */
.noise{
  position:absolute;
  inset:0;
  opacity:.03;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
  z-index:5;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM - DUAL LINE
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:12vh;
  padding-bottom:12vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
  z-index:10;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(20px,4vw,30px);
  line-height:1.32;
  color:rgba(255,255,255,.78);
  max-width:92%;
  margin-top:6px;
  text-wrap:balance;
}

.cta{
  font-size:clamp(28px,6vw,44px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:20;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:30;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* ---------------------------------------------------------
   BRAND BAR
   --------------------------------------------------------- */

.brand-bar{
  position:absolute;
  top:3vh;
  left:4vw;
  padding:6px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);

  box-shadow:
    0 0 12px rgba(255,255,255,.04),
    inset 0 0 8px rgba(255,255,255,.03);

  opacity:.42;
  z-index:40;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="wash"></div>
<div class="ambient"></div>
<div class="shimmer"></div>
<div class="noise"></div>

<div class="brand-bar">FINALMINDSET</div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   WIDGET 03 - 30‑DAY IDENTITY REBUILD ENGINE
   --------------------------------------------------------- */

const categories = {
  rebuild30: {
    hooks: [
      "Rebuild your identity in the next 30 days.",
      "Your 30‑day reconstruction begins now.",
      "Give yourself 30 days - your entire structure changes.",
      "The next 30 days will redefine who you are.",
      "Run the 30‑day identity rebuild protocol."
    ],

    punches: [
      "You’re not broken - you’re under‑structured.",
      "You’re not lost - you’re unaligned with your future self.",
      "You’re not inconsistent - your foundation is outdated.",
      "You’re not behind - your identity hasn’t caught up yet.",
      "You’re not failing - you’re rebuilding from the ground up."
    ],

    tensions: [
      "Your current identity can’t support the life you want.",
      "Your habits belong to a version of you that no longer exists.",
      "Your clarity collapses when your structure is unstable.",
      "Your potential is trapped behind outdated routines.",
      "Your environment is built for your past, not your future."
    ],

    collapses: [
      "Rebuild the structure → the identity stabilises.",
      "Upgrade the foundation → the future self appears.",
      "Strengthen the system → the discipline becomes natural.",
      "Rewrite the routine → the identity follows.",
      "Reconstruct the base → the next chapter unlocks."
    ]
  }
};

/* CTAs - Viral Loops */
const ctas = [
  "Save this for your 30‑day rebuild.",
  "Read this again tonight - it’ll anchor you.",
  "Share this with someone rebuilding their life.",
  "If you’re reading this, your rebuild has already begun.",
  "Your future self will thank you for saving this."
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function pickCategory(){
  return categories.rebuild30;
}

function buildSlides(){
  const cat = pickCategory();
  const hook = pick(cat.hooks);
  const punch = pick(cat.punches);
  const tension = pick(cat.tensions);
  const collapse = pick(cat.collapses);
  const cta = pick(ctas);

  return [
    {
      type:"pair",
      s1:hook,
      s2:"This is the chapter where your structure becomes unbreakable."
    },
    {
      type:"pair",
      s1:punch,
      s2:"Your system is trying to evolve on a foundation that can’t support it."
    },
    {
      type:"pair",
      s1:tension,
      s2:"You’re trying to grow inside a framework built for your past."
    },
    {
      type:"pair",
      s1:collapse,
      s2:"The future self appears the moment the foundation is upgraded."
    },
    {
      type:"cta",
      text:cta
    }
  ];
}

/* Render engine */
const slidesContainer = document.getElementById("slides");
const navDots = document.getElementById("navDots");
let index = 0;
let currentSlides = buildSlides();

function render(){
  slidesContainer.innerHTML = "";
  navDots.innerHTML = "";

  currentSlides.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "slide" + (i===index ? " active" : "");

    if(s.type === "pair"){
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        ${s.s2 ? `<div class="s2">${s.s2}</div>` : ""}
      `;
    } else {
      el.innerHTML = `<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot = document.createElement("div");
    dot.className = "dot" + (i===index ? " active" : "");
    navDots.appendChild(dot);
  });
}

function next(){
  index = (index + 1) % currentSlides.length;
  render();
}

function prev(){
  index = (index - 1 + currentSlides.length) % currentSlides.length;
  render();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

render();
</script>

</body>
</html>
