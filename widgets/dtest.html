<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Monolith Widget</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    .monolith {
      width: 90vw;
      max-width: 420px;
      padding: 34px 30px;
      background: #000;
      position: relative;
      animation: appear 0.12s ease-out forwards;
    }

    /* Ultra-faint steel edge */
    .monolith::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(180, 185, 195, 0.08);
      pointer-events: none;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .line {
      display: flex;
      gap: 12px;
      opacity: 0;
      animation: materialise 0.12s ease-out 0.1s forwards;
    }

    @keyframes materialise {
      to { opacity: 1; }
    }

    .glyph {
      width: 9px;
      height: 9px;
      transform: rotate(45deg);
      background: #7f848a;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .text {
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: 0.02em;
      font-weight: 350;
      color: #c9ccd1;
    }
  </style>
</head>

<body>
  <div class="monolith">
    <div class="line">
      <div class="glyph"></div>
      <div class="text">
        I bow only to power, and to the birds that see everything.
      </div>
    </div>
  </div>
</body>
</html>
