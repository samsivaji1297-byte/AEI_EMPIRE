<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3-Reason Engine V2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* Background base */
.bg{
  position:absolute;
  inset:-30%;
  filter:blur(80px);
  opacity:0.9;
  animation:drift 26s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.25) translate(-60px,-80px);}
}

/* Soft noise fog (visual hook) */
.fog{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.06),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;
  opacity:0.18;
  filter:blur(24px);
  animation:fogShift 38s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes fogShift{
  from{transform:translate3d(-10px,10px,0) scale(1);}
  to{transform:translate3d(20px,-20px,0) scale(1.12);}
}

/* Glass + noise */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent);
  backdrop-filter:blur(18px);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.035;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* Slide container */
.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:11vh;
  padding-bottom:11vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

/* Typography */
.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(22px,4.4vw,34px);
  line-height:1.3;
  color:rgba(255,255,255,.82);
  max-width:92%;
  text-wrap:balance;
}

/* CTA */
.cta{
  font-size:clamp(26px,6vw,42px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }
</style>
</head>
<body>

<div id="bg" class="bg"></div>
<div class="fog"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   3-REASON ENGINE V2
   - Hook → #1 → #2 → #3 → CTA
   - One-sentence payloads
   - Fixed 5-slide structure
   - Premium themes + soft noise fog
   - Tightened transitions and spacing
   --------------------------------------------------------- */

/* Weighted colour themes */
const themes = [
  { weight:3, bg:"radial-gradient(circle at 20% 0%,rgba(255,255,255,.10),transparent 55%),linear-gradient(180deg,#050505,#000)" }, // Obsidian Fade
  { weight:3, bg:"radial-gradient(circle at 10% 10%,rgba(120,150,255,.20),transparent 55%),linear-gradient(180deg,#020617,#02010a)" }, // Midnight Iron
  { weight:2, bg:"radial-gradient(circle at 80% 0%,rgba(200,200,200,.18),transparent 55%),linear-gradient(180deg,#0a0a0a,#181818)" }, // Graphite Pulse
  { weight:2, bg:"radial-gradient(circle at 15% 0%,rgba(255,80,120,.22),transparent 55%),linear-gradient(180deg,#1a0006,#020005)" }, // Deep Burgundy Smoke
  { weight:2, bg:"radial-gradient(circle at 80% 10%,rgba(80,255,150,.20),transparent 55%),linear-gradient(180deg,#00140a,#000)" }, // Forest Void
  { weight:2, bg:"radial-gradient(circle at 20% 0%,rgba(180,120,255,.22),transparent 55%),linear-gradient(180deg,#0f001a,#02000a)" }, // Royal Amethyst Mist
  { weight:1, bg:"radial-gradient(circle at 10% 90%,rgba(90,180,255,.18),transparent 55%),linear-gradient(180deg,#020814,#000)" }, // Blue-Steel Nebula
  { weight:1, bg:"radial-gradient(circle at 85% 15%,rgba(255,140,80,.18),transparent 55%),linear-gradient(180deg,#120604,#000)" }  // Charcoal Ember
];

function pickWeightedTheme(){
  const total = themes.reduce((sum,t)=>sum+t.weight,0);
  let r = Math.random()*total;
  for(const t of themes){
    if(r < t.weight) return t;
    r -= t.weight;
  }
  return themes[0];
}

/* HOOKS */
const hookPool = [
  "3 reasons you still feel stuck.",
  "3 reasons you can’t stay consistent.",
  "3 reasons you don’t trust yourself yet.",
  "3 reasons you keep restarting your life.",
  "3 reasons you feel behind all the time.",
  "3 reasons your progress never feels real.",
  "3 reasons you keep circling the same problems.",
  "3 reasons you don’t believe your own decisions.",
  "3 reasons you always end up back at zero.",
  "3 reasons you can’t hold the life you say you want."
];

/* SETUP SENTENCES */
const setupPool = [
  "If this feels like you, these will expose the real pattern.",
  "You’ve felt this for a while — here’s why it keeps happening.",
  "These three truths explain more than you think.",
  "If you’re tired of repeating the same cycle, start here.",
  "This is the part nobody ever tells you.",
  "You’re not broken — you’re just running an old script.",
  "If you recognise yourself in this, pay attention.",
  "This is why nothing ever fully lands for you.",
  "If you’re exhausted by your own loops, read this slowly.",
  "You’ve tried willpower — this is what’s actually in the way."
];

/* PAYLOADS (one sentence each) */
const payloadPool = [
  "You keep negotiating with your old identity instead of committing to your new one.",
  "Your nervous system doesn’t trust the life you say you want yet.",
  "You’re still trying to earn permission instead of making decisions.",
  "You’re operating from borrowed expectations instead of your own truth.",
  "You haven’t built a self-image that matches your goals.",
  "You’re addicted to the emotional familiarity of struggle.",
  "You’re waiting to feel ready instead of moving while unprepared.",
  "You’re still living in reaction instead of direction.",
  "You’re trying to change outcomes without changing identity.",
  "You’re outsourcing your clarity to other people.",
  "You keep choosing urgency over depth because urgency feels safer.",
  "You’re more loyal to your old story than to your future.",
  "You confuse overthinking with being responsible.",
  "You’re still trying to be understood instead of being undeniable.",
  "You treat your life like a problem to solve, not a reality to build.",
  "You’re chasing intensity instead of stability.",
  "You’re waiting for proof before you act like the person you want to be.",
  "You keep collecting information instead of building evidence.",
  "You’re still performing for people who aren’t even watching.",
  "You’re trying to outwork a misaligned identity.",
  "You keep abandoning yourself the moment it gets quiet.",
  "You’re more comfortable fixing crises than holding peace.",
  "You’re still asking, “Is this allowed?” instead of “Is this mine?”",
  "You’re trying to drag your old life into a new chapter.",
  "You keep mistaking chaos for momentum.",
  "You’re still negotiating with habits you should have fired.",
  "You’re waiting for someone to validate what you already know.",
  "You keep building futures you secretly don’t want.",
  "You’re trying to be less “too much” instead of fully accurate.",
  "You’re still trying to win in rooms you’ve outgrown."
];

/* CTA POOL */
const ctaPool = [
  "Begin properly — the link in my bio will make the next step obvious.",
  "If this hit, go to the link in my bio and start correctly.",
  "Enter the protocol — the link in my bio is where you begin.",
  "If this exposed you, the next step is in my bio.",
  "Return to yourself — start with the link in my bio.",
  "If this feels like your truth, the link in my bio is your next move.",
  "Stop restarting — go to the link in my bio and build it properly.",
  "If this landed, the framework is waiting in my bio.",
  "Comment if this is you — then go to the link in my bio.",
  "If you’re done looping, the first clean step is in my bio."
];

/* Utils */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function pickDistinct(arr,count){
  const copy=[...arr];
  const out=[];
  while(out.length<count && copy.length){
    const idx=Math.floor(Math.random()*copy.length);
    out.push(copy[idx]);
    copy.splice(idx,1);
  }
  return out;
}

/* Build the 5-slide carousel */
function buildSlides(){
  const theme = pickWeightedTheme();
  document.getElementById("bg").style.background = theme.bg;

  const hook = pick(hookPool);
  const setup = pick(setupPool);
  const payloads = pickDistinct(payloadPool, 3);
  const cta = pick(ctaPool);

  const slides = [];

  // Slide 1: Hook
  slides.push({
    type:"pair",
    s1:hook,
    s2:setup
  });

  // Slide 2: #1
  slides.push({
    type:"pair",
    s1:"#1",
    s2:payloads[0]
  });

  // Slide 3: #2
  slides.push({
    type:"pair",
    s1:"#2",
    s2:payloads[1]
  });

  // Slide 4: #3
  slides.push({
    type:"pair",
    s1:"#3",
    s2:payloads[2]
  });

  // Slide 5: CTA
  slides.push({
    type:"cta",
    text:cta
  });

  return slides;
}

/* Render engine */
const slidesContainer=document.getElementById("slides");
const navDots=document.getElementById("navDots");
let index=0;
let currentSlides=buildSlides();

function render(){
  slidesContainer.innerHTML="";
  navDots.innerHTML="";

  currentSlides.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="slide"+(i===index?" active":"");

    if(s.type==="pair"){
      el.innerHTML=`
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
      `;
    } else {
      el.innerHTML=`<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot=document.createElement("div");
    dot.className="dot"+(i===index?" active":"");
    navDots.appendChild(dot);
  });
}

function next(){ index=(index+1)%currentSlides.length; render(); }
function prev(){ index=(index-1+currentSlides.length)%currentSlides.length; render(); }

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

render();
</script>

</body>
</html>
