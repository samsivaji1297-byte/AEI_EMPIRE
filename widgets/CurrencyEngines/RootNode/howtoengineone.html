<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>How-To Engine V2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* Background base */
.bg{
  position:absolute;
  inset:-30%;
  filter:blur(80px);
  opacity:0.9;
  animation:drift 26s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.25) translate(-60px,-80px);}
}

/* Soft noise fog (visual hook) */
.fog{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.06),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;
  opacity:0.18;
  filter:blur(24px);
  animation:fogShift 38s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes fogShift{
  from{transform:translate3d(-10px,10px,0) scale(1);}
  to{transform:translate3d(20px,-20px,0) scale(1.12);}
}

/* Glass + noise */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent);
  backdrop-filter:blur(18px);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.035;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* Slide container */
.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:11vh;
  padding-bottom:11vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

/* Typography */
.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(22px,4.4vw,34px);
  line-height:1.3;
  color:rgba(255,255,255,.82);
  max-width:92%;
  text-wrap:balance;
}

/* CTA */
.cta{
  font-size:clamp(26px,6vw,42px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }
</style>
</head>
<body>

<div id="bg" class="bg"></div>
<div class="fog"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   HOW-TO ENGINE V2
   - Mode A: Standard How-To
   - Mode B: "99% of people" dominance frame
   - 5-slide structure:
       1) Hook + setup
       2) Step #1
       3) Step #2
       4) Step #3
       5) CTA
   - Inherits sovereign V2 chassis + soft noise fog
   --------------------------------------------------------- */

/* Weighted colour themes (same sovereign palette) */
const themes = [
  { weight:3, bg:"radial-gradient(circle at 20% 0%,rgba(255,255,255,.10),transparent 55%),linear-gradient(180deg,#050505,#000)" }, // Obsidian Fade
  { weight:3, bg:"radial-gradient(circle at 10% 10%,rgba(120,150,255,.20),transparent 55%),linear-gradient(180deg,#020617,#02010a)" }, // Midnight Iron
  { weight:2, bg:"radial-gradient(circle at 80% 0%,rgba(200,200,200,.18),transparent 55%),linear-gradient(180deg,#0a0a0a,#181818)" }, // Graphite Pulse
  { weight:2, bg:"radial-gradient(circle at 15% 0%,rgba(255,80,120,.22),transparent 55%),linear-gradient(180deg,#1a0006,#020005)" }, // Deep Burgundy Smoke
  { weight:2, bg:"radial-gradient(circle at 80% 10%,rgba(80,255,150,.20),transparent 55%),linear-gradient(180deg,#00140a,#000)" }, // Forest Void
  { weight:2, bg:"radial-gradient(circle at 20% 0%,rgba(180,120,255,.22),transparent 55%),linear-gradient(180deg,#0f001a,#02000a)" }, // Royal Amethyst Mist
  { weight:1, bg:"radial-gradient(circle at 10% 90%,rgba(90,180,255,.18),transparent 55%),linear-gradient(180deg,#020814,#000)" }, // Blue-Steel Nebula
  { weight:1, bg:"radial-gradient(circle at 85% 15%,rgba(255,140,80,.18),transparent 55%),linear-gradient(180deg,#120604,#000)" }  // Charcoal Ember
];

function pickWeightedTheme(){
  const total = themes.reduce((sum,t)=>sum+t.weight,0);
  let r = Math.random()*total;
  for(const t of themes){
    if(r < t.weight) return t;
    r -= t.weight;
  }
  return themes[0];
}

/* -----------------------------
   HOOK POOLS
   ----------------------------- */

/* Standard How-To hooks */
const howToHooks = [
  "How to stop self-sabotaging.",
  "How to rebuild your confidence from zero.",
  "How to stop restarting your life every few months.",
  "How to finally stay consistent.",
  "How to stop abandoning yourself when it matters.",
  "How to rebuild your life after burning it down.",
  "How to stop overthinking and actually move.",
  "How to trust your own decisions again.",
  "How to stop feeling behind all the time.",
  "How to start showing up like the person you say you are."
];

/* Standard How-To setups */
const howToSetups = [
  "If this feels like you, use these three steps as your new baseline.",
  "You don’t need more motivation — you need a cleaner process.",
  "Save this and run it for 30 days before you decide it doesn’t work.",
  "If you’re tired of looping, start with these three moves.",
  "This is the simplest way to get yourself back into motion.",
  "You don’t need a new life — you need a new way of operating.",
  "If you recognise yourself in this, treat these steps as non-negotiable.",
  "This is the protocol you wish you had the first time you broke.",
  "If you’re exhausted by your own patterns, start here.",
  "Run this like a checklist, not a quote."
];

/* "99% of people" hooks */
const hooks99 = [
  "How to get ahead of 99% of people.",
  "How to outpace 99% of people without burning out.",
  "How to think in a way 99% of people never will.",
  "How to build a life 99% of people can’t hold.",
  "How to operate at a level 99% of people never reach.",
  "How to separate yourself from 99% of people quietly.",
  "How to move like the 1% while everyone else scrolls.",
  "How to become the person 99% of people pretend to be online.",
  "How to build discipline 99% of people will never touch.",
  "How to stop living like the 99% you secretly judge."
];

/* "99% of people" setups */
const setups99 = [
  "None of this is complicated — it’s just what most people refuse to do.",
  "If you actually run these, you won’t recognise your life in a year.",
  "This is not about talent — it’s about how you choose to operate.",
  "Most people know this. Almost nobody lives it.",
  "If you do this consistently, you stop competing with average.",
  "This is how you quietly exit the category everyone else is stuck in.",
  "You don’t need to be special — you just need to stop behaving like the 99%.",
  "If you’re serious about being different, start here.",
  "This is the boring truth behind every “overnight success.”",
  "If you want separation, this is the cleanest way to get it."
];

/* -----------------------------
   STEP PAYLOAD POOLS
   ----------------------------- */

/* Standard How-To step payloads */
const howToSteps = [
  "Tell the truth about where you actually are, not where you wish you were.",
  "Make one tiny action the non-negotiable floor of your day.",
  "Remove the option to negotiate with yourself once you’ve decided.",
  "Design your environment so the right choice is the easiest one.",
  "Reduce your inputs so your brain can finally hear itself think.",
  "Decide who you’re becoming, then stop collecting evidence against it.",
  "Break your goal into embarrassingly small daily moves.",
  "Track proof of what you did, not guilt about what you didn’t.",
  "Replace “I’ll start again Monday” with “I’ll start again now.”",
  "Stop asking if you feel like it — ask if it’s aligned.",
  "Give yourself fewer options and more standards.",
  "Treat your calendar like a contract, not a suggestion.",
  "Build one anchor habit that you do even on your worst days.",
  "Stop trying to fix everything at once — stabilise one area first.",
  "Create a simple rule for yourself and honour it ruthlessly.",
  "Make your phone harder to reach than your work.",
  "Decide what you’re no longer available for and act accordingly.",
  "Replace self-judgment with self-audit: what actually happened?",
  "Ask “what would the accurate version of me do?” and do that.",
  "Stop waiting to feel ready — move while you still feel unqualified."
];

/* "99% of people" step payloads */
const steps99 = [
  "Do the boring fundamentals every day — 99% of people won’t.",
  "Cut the inputs that make you think like everyone else.",
  "Protect your focus like it’s the only asset you have.",
  "Build a schedule that serves your future, not your impulses.",
  "Stop explaining your standards to people who don’t have any.",
  "Spend more time executing than consuming other people’s lives.",
  "Treat your body like hardware for your ambition, not decoration.",
  "Learn skills that compound instead of opinions that expire.",
  "Surround yourself with people who make your excuses feel stupid.",
  "Make your word to yourself more sacred than your word to others.",
  "Use your free time to build leverage, not just escape.",
  "Get comfortable being misunderstood by average people.",
  "Choose long-term positioning over short-term validation.",
  "Build systems that work on your worst days, not just your best.",
  "Stop chasing motivation — engineer conditions where action is default.",
  "Audit your habits like an investor audits a company.",
  "Detach your identity from your current results.",
  "Make peace with being the only one taking it seriously.",
  "Let your work speak so loudly you don’t need to.",
  "Operate like someone who expects to win, not someone hoping to be chosen."
];

/* CTA pool (shared) */
const ctaPool = [
  "If this landed, the link in my bio shows you how to run this properly.",
  "Save this, then go to the link in my bio and start the real work.",
  "If you’re done looping, the framework is waiting in my bio.",
  "Run this for 30 days — and use the link in my bio to do it cleanly.",
  "If this exposed you, the next step is in my bio.",
  "You don’t need more content — you need a protocol. It’s in my bio.",
  "If this feels like your truth, the link in my bio is your next move.",
  "Stop restarting — go to the link in my bio and build it properly.",
  "If you’re serious, treat the link in my bio like a starting line.",
  "Comment if this is you — then go to the link in my bio."
];

/* Utils */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function pickDistinct(arr,count){
  const copy=[...arr];
  const out=[];
  while(out.length<count && copy.length){
    const idx=Math.floor(Math.random()*copy.length);
    out.push(copy[idx]);
    copy.splice(idx,1);
  }
  return out;
}

/* Build the 5-slide How-To carousel */
function buildSlides(){
  const theme = pickWeightedTheme();
  document.getElementById("bg").style.background = theme.bg;

  // Randomly choose mode: standard or 99%
  const is99 = Math.random() < 0.5;

  const hook = is99 ? pick(hooks99) : pick(howToHooks);
  const setup = is99 ? pick(setups99) : pick(howToSetups);
  const steps = is99 ? pickDistinct(steps99,3) : pickDistinct(howToSteps,3);
  const cta = pick(ctaPool);

  const slides = [];

  // Slide 1: Hook + setup
  slides.push({
    type:"pair",
    s1:hook,
    s2:setup
  });

  // Slide 2: Step #1
  slides.push({
    type:"pair",
    s1:"#1",
    s2:steps[0]
  });

  // Slide 3: Step #2
  slides.push({
    type:"pair",
    s1:"#2",
    s2:steps[1]
  });

  // Slide 4: Step #3
  slides.push({
    type:"pair",
    s1:"#3",
    s2:steps[2]
  });

  // Slide 5: CTA
  slides.push({
    type:"cta",
    text:cta
  });

  return slides;
}

/* Render engine */
const slidesContainer=document.getElementById("slides");
const navDots=document.getElementById("navDots");
let index=0;
let currentSlides=buildSlides();

function render(){
  slidesContainer.innerHTML="";
  navDots.innerHTML="";

  currentSlides.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="slide"+(i===index?" active":"");

    if(s.type==="pair"){
      el.innerHTML=`
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
      `;
    } else {
      el.innerHTML=`<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot=document.createElement("div");
    dot.className="dot"+(i===index?" active":"");
    navDots.appendChild(dot);
  });
}

function next(){ index=(index+1)%currentSlides.length; render(); }
function prev(){ index=(index-1+currentSlides.length)%currentSlides.length; render(); }

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

render();
</script>

</body>
</html>
