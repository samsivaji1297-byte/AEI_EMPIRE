<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>30-Day Engine — FinalMindset</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   V3 AESTHETIC UPGRADE
   --------------------------------------------------------- */

/* Deep gradient background */
.bg{
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.08),transparent 60%),
    radial-gradient(circle at 80% 100%,rgba(255,255,255,.05),transparent 60%),
    linear-gradient(180deg,#020202,#000);
  filter:blur(90px);
  opacity:0.9;
  animation:drift 32s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.3) translate(-80px,-120px);}
}

/* Soft fog layer */
.fog{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.05),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;
  opacity:0.18;
  filter:blur(28px);
  animation:fogShift 40s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes fogShift{
  from{transform:translate3d(-10px,10px,0) scale(1);}
  to{transform:translate3d(20px,-20px,0) scale(1.12);}
}

/* Particle shimmer */
.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:3px 3px, 5px 5px;
  opacity:.06;
  animation:particleDrift 60s linear infinite;
}

@keyframes particleDrift{
  from{transform:translate(0,0);}
  to{transform:translate(-120px,-80px);}
}

/* Grid shimmer */
.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  mix-blend-mode:overlay;
  opacity:.05;
  animation:gridPulse 14s ease-in-out infinite alternate;
}

@keyframes gridPulse{
  from{opacity:.03;}
  to{opacity:.08;}
}

/* Glass overlay */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent);
  backdrop-filter:blur(20px);
}

/* Micro-grain texture */
.noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:11vh;
  padding-bottom:11vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(22px,4.4vw,34px);
  line-height:1.3;
  color:rgba(255,255,255,.82);
  max-width:92%;
  text-wrap:balance;
}

.cta{
  font-size:clamp(26px,6vw,42px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* ---------------------------------------------------------
   FINALMINDSET BRAND SIGNATURE
   --------------------------------------------------------- */

.brand{
  position:absolute;
  bottom:2vh;
  right:4vw;
  font-size:12px;
  letter-spacing:2px;
  opacity:.35;
  text-transform:uppercase;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="bg" class="bg"></div>
<div class="fog"></div>
<div class="particles"></div>
<div class="grid"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<div class="brand">FinalMindset</div>

<script>
/* ---------------------------------------------------------
   30-DAY ENGINE (EXAMPLE)
   --------------------------------------------------------- */

const hook = "Do this for 30 days and your entire life will shift.";
const setup = "Run these three moves daily — no intensity, just consistency.";

const steps = [
  "Pick one habit that takes less than 5 minutes and do it every day.",
  "Remove one input that drains you and replace it with silence.",
  "Track your actions, not your emotions — proof beats feelings."
];

const cta = "If you’re serious, the link in my bio shows you how to run this properly.";

function buildSlides(){
  return [
    { type:"pair", s1:hook, s2:setup },
    { type:"pair", s1:"#1", s2:steps[0] },
    { type:"pair", s1:"#2", s2:steps[1] },
    { type:"pair", s1:"#3", s2:steps[2] },
    { type:"cta", text:cta }
  ];
}

/* Render engine */
const slidesContainer=document.getElementById("slides");
const navDots=document.getElementById("navDots");
let index=0;
let currentSlides=buildSlides();

function render(){
  slidesContainer.innerHTML="";
  navDots.innerHTML="";

  currentSlides.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="slide"+(i===index?" active":"");

    if(s.type==="pair"){
      el.innerHTML=`
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
      `;
    } else {
      el.innerHTML=`<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot=document.createElement("div");
    dot.className="dot"+(i===index?" active":"");
    navDots.appendChild(dot);
  });
}

function next(){ index=(index+1)%currentSlides.length; render(); }
function prev(){ index=(index-1+currentSlides.length)%currentSlides.length; render(); }

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

render();
</script>

</body>
</html>
