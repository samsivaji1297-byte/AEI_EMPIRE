<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Multi‑Mode Engine — Long‑Press Menu</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* Background */
.bg{
  position:absolute;
  inset:-30%;
  filter:blur(80px);
  opacity:0.9;
  animation:drift 26s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.2) translate(-50px,-70px);}
}

/* Glass + noise */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.05),transparent);
  backdrop-filter:blur(18px);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* Slide container */
.slide{
  position:absolute;
  inset:0;
  padding:0 10vw;
  padding-top:12vh;
  padding-bottom:12vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(40px);
  transition:opacity .7s ease, transform .7s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

/* Typography */
.s1{
  font-size:clamp(32px,7vw,72px);
  line-height:1.05;
  font-weight:700;
  letter-spacing:-1.1px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(20px,4.4vw,34px);
  line-height:1.32;
  color:rgba(255,255,255,.82);
  max-width:90%;
  text-wrap:balance;
}

.list{
  font-size:clamp(18px,4vw,28px);
  line-height:1.4;
  color:rgba(255,255,255,.85);
  margin-top:10px;
}

.list-item{
  margin-bottom:6px;
}

.cta{
  font-size:clamp(26px,6vw,40px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Mode label */
.mode-label{
  position:absolute;
  top:4vh;
  left:10vw;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* Invisible long-press hotspot */
#modeHotspot{
  position:absolute;
  top:0;
  left:0;
  width:22vw;
  height:18vh;
  z-index:50;
}

/* Floating mode menu */
#modeMenu{
  position:absolute;
  top:6vh;
  left:10vw;
  background:rgba(0,0,0,.78);
  padding:14px 18px;
  border-radius:12px;
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  display:none;
  z-index:60;
}

.mode-item{
  font-size:13px;
  padding:6px 0;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(255,255,255,.82);
}
.mode-item.active{
  color:#fff;
}
.mode-item + .mode-item{
  border-top:1px solid rgba(255,255,255,.08);
}

/* Optional tiny hint (can remove if you want it fully invisible) */
.mode-hint{
  position:absolute;
  top:4vh;
  right:10vw;
  font-size:10px;
  color:rgba(255,255,255,.35);
  text-align:right;
}
</style>
</head>
<body>

<div id="bg" class="bg"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div class="mode-label" id="modeLabel"></div>
<div class="mode-hint">hold top-left to switch mode</div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<div id="modeHotspot"></div>
<div id="modeMenu"></div>

<script>
/* ---------------------------------------------------------
   MULTI-MODE ENGINE — LONG-PRESS MENU
   - One shell
   - Multiple modes
   - Long-press top-left to switch mode
   --------------------------------------------------------- */

/* Themes per mode */
const THEMES = {
  "3-reason": "radial-gradient(circle at 20% 0%,rgba(255,255,255,.12),transparent 55%),linear-gradient(180deg,#050505,#000)",
  "how-to": "radial-gradient(circle at 10% 10%,rgba(120,150,255,.20),transparent 55%),linear-gradient(180deg,#020617,#000)",
  "framework": "radial-gradient(circle at 80% 0%,rgba(255,120,180,.20),transparent 55%),linear-gradient(180deg,#14000a,#000)"
};

/* MODE 1: 3-REASON ENGINE (example) */
function build3ReasonSlides(){
  return [
    {
      type:"pair",
      s1:"3 reasons you still feel stuck.",
      s2:"If this sounds like you, these three are usually the real problem."
    },
    {
      type:"pair",
      s1:"#1",
      s2:"You keep negotiating with your old identity instead of committing to your new one."
    },
    {
      type:"pair",
      s1:"#2",
      s2:"You’re waiting to feel ready instead of moving while unprepared."
    },
    {
      type:"pair",
      s1:"#3",
      s2:"You’re trying to change outcomes without changing who you are being day to day."
    },
    {
      type:"cta",
      s1:"Begin properly — the link in my bio is where you start."
    }
  ];
}

/* MODE 2: HOW-TO ENGINE (example) */
function buildHowToSlides(){
  return [
    {
      type:"pair",
      s1:"How to rebuild your self-trust.",
      s2:"A simple sequence you can actually follow without burning out."
    },
    {
      type:"list",
      s1:"Step 1",
      s2:"Shrink the promise.",
      items:[
        "Pick one micro-commitment you can keep even on a bad day.",
        "Make it so small it feels almost insulting to your ambition."
      ]
    },
    {
      type:"list",
      s1:"Step 2",
      s2:"Stack evidence.",
      items:[
        "Track only: did I keep the promise, yes or no.",
        "Your nervous system trusts repetition, not declarations."
      ]
    },
    {
      type:"list",
      s1:"Step 3",
      s2:"Increase the load slowly.",
      items:[
        "Once it feels automatic, raise the bar by 10–20%, not 10x.",
        "You’re building a reputation with yourself, not chasing a high."
      ]
    },
    {
      type:"cta",
      s1:"If you want this structured for you, the link in my bio is the next move."
    }
  ];
}

/* MODE 3: COPY-MY-FRAMEWORK ENGINE (example) */
function buildFrameworkSlides(){
  return [
    {
      type:"pair",
      s1:"My 3-layer content framework.",
      s2:"You can steal this and plug your niche straight into it."
    },
    {
      type:"list",
      s1:"Layer 1 — Recognition",
      s2:"Make them feel seen before you teach them anything.",
      items:[
        "Name the pattern they’re stuck in with brutal clarity.",
        "Describe the emotional cost better than they can."
      ]
    },
    {
      type:"list",
      s1:"Layer 2 — Reframe",
      s2:"Shift how they see the problem, not just the solution.",
      items:[
        "Show why their current approach could never work long-term.",
        "Introduce a cleaner lens that makes your method inevitable."
      ]
    },
    {
      type:"list",
      s1:"Layer 3 — Direction",
      s2:"Give them a next step that feels obvious, not heavy.",
      items:[
        "One action, one link, one decision.",
        "Your offer is just the logical continuation of the reframe."
      ]
    },
    {
      type:"cta",
      s1:"If you want to plug your offer into this framework, start at the link in my bio."
    }
  ];
}

/* MODE REGISTRY */
const MODES = {
  "3-reason": {
    id:"3-reason",
    label:"MODE: 3-REASON ENGINE",
    buildSlides:build3ReasonSlides
  },
  "how-to": {
    id:"how-to",
    label:"MODE: HOW-TO ENGINE",
    buildSlides:buildHowToSlides
  },
  "framework": {
    id:"framework",
    label:"MODE: COPY-MY-FRAMEWORK ENGINE",
    buildSlides:buildFrameworkSlides
  }
};

/* INITIAL MODE (no manual input required) */
let currentModeId = "3-reason";
let currentSlides = MODES[currentModeId].buildSlides();
let index = 0;

/* DOM refs */
const bgEl = document.getElementById("bg");
const slidesContainer = document.getElementById("slides");
const navDots = document.getElementById("navDots");
const modeLabelEl = document.getElementById("modeLabel");
const hotspot = document.getElementById("modeHotspot");
const menu = document.getElementById("modeMenu");

/* Apply theme + label */
function applyModeChrome(){
  const theme = THEMES[currentModeId] || THEMES["3-reason"];
  bgEl.style.background = theme;
  modeLabelEl.textContent = MODES[currentModeId].label;
}

/* RENDER ENGINE */
function render(){
  slidesContainer.innerHTML = "";
  navDots.innerHTML = "";

  currentSlides.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "slide" + (i===index ? " active" : "");

    if(s.type === "pair"){
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
      `;
    } else if(s.type === "list"){
      const itemsHtml = (s.items || []).map(item=>`<div class="list-item">• ${item}</div>`).join("");
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        <div class="s2">${s.s2}</div>
        <div class="list">${itemsHtml}</div>
      `;
    } else if(s.type === "cta"){
      el.innerHTML = `<div class="cta">${s.s1}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot = document.createElement("div");
    dot.className = "dot" + (i===index ? " active" : "");
    navDots.appendChild(dot);
  });
}

/* NAVIGATION */
function next(){
  index = (index + 1) % currentSlides.length;
  render();
}

function prev(){
  index = (index - 1 + currentSlides.length) % currentSlides.length;
  render();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

/* LONG-PRESS MODE MENU */
let pressTimer = null;
let menuVisible = false;

function showMenu(){
  menu.innerHTML = Object.keys(MODES).map(modeId => {
    const activeClass = modeId === currentModeId ? "mode-item active" : "mode-item";
    return `<div class="${activeClass}" data-mode="${modeId}">
              ${MODES[modeId].label}
            </div>`;
  }).join("");

  menu.style.display = "block";
  menuVisible = true;
}

function hideMenu(){
  menu.style.display = "none";
  menuVisible = false;
}

function startPress(){
  if(pressTimer) clearTimeout(pressTimer);
  pressTimer = setTimeout(showMenu, 600);
}

function cancelPress(){
  if(pressTimer) clearTimeout(pressTimer);
}

hotspot.addEventListener("touchstart", startPress);
hotspot.addEventListener("mousedown", startPress);

hotspot.addEventListener("touchend", cancelPress);
hotspot.addEventListener("mouseup", cancelPress);
hotspot.addEventListener("mouseleave", cancelPress);

menu.addEventListener("click", e => {
  const mode = e.target.getAttribute("data-mode");
  if(!mode || !MODES[mode]) return;

  currentModeId = mode;
  currentSlides = MODES[currentModeId].buildSlides();
  index = 0;

  applyModeChrome();
  render();
  hideMenu();
});

/* INIT */
applyModeChrome();
render();
</script>

</body>
</html>
