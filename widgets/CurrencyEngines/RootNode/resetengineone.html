<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Category-Locked Engine — FinalMindset</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
}

body{
  position:relative;
}

/* ---------------------------------------------------------
   AESTHETIC LAYER (V3)
   --------------------------------------------------------- */

.bg{
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.08),transparent 60%),
    radial-gradient(circle at 80% 100%,rgba(255,255,255,.05),transparent 60%),
    linear-gradient(180deg,#020202,#000);
  filter:blur(90px);
  opacity:0.9;
  animation:drift 32s ease-in-out infinite alternate;
}

@keyframes drift{
  from{transform:scale(1) translate(0,0);}
  to{transform:scale(1.3) translate(-80px,-120px);}
}

.fog{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.05),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;
  opacity:0.18;
  filter:blur(28px);
  animation:fogShift 40s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes fogShift{
  from{transform:translate3d(-10px,10px,0) scale(1);}
  to{transform:translate3d(20px,-20px,0) scale(1.12);}
}

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:3px 3px, 5px 5px;
  opacity:.06;
  animation:particleDrift 60s linear infinite;
}

@keyframes particleDrift{
  from{transform:translate(0,0);}
  to{transform:translate(-120px,-80px);}
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  mix-blend-mode:overlay;
  opacity:.05;
  animation:gridPulse 14s ease-in-out infinite alternate;
}

@keyframes gridPulse{
  from{opacity:.03;}
  to{opacity:.08;}
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent);
  backdrop-filter:blur(20px);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

/* ---------------------------------------------------------
   SLIDE SYSTEM
   --------------------------------------------------------- */

.slide{
  position:absolute;
  inset:0;
  padding:0 9vw;
  padding-top:11vh;
  padding-bottom:11vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(32px);
  transition:opacity .65s ease, transform .65s ease;
}

.slide.active{
  opacity:1;
  transform:translateY(0);
}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;
  font-weight:700;
  letter-spacing:-1.2px;
  margin-bottom:18px;
  text-wrap:balance;
}

.s2{
  font-size:clamp(22px,4.4vw,34px);
  line-height:1.3;
  color:rgba(255,255,255,.82);
  max-width:92%;
  text-wrap:balance;
}

.cta{
  font-size:clamp(26px,6vw,42px);
  line-height:1.25;
  font-weight:600;
  color:#fff;
  max-width:90%;
}

/* Navigation dots */
.nav{
  position:absolute;
  bottom:5vh;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:10;
}

.dot{
  width:7px;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  transition:all .25s ease;
}

.dot.active{
  width:22px;
  background:#fff;
}

/* Tap zones */
.tap-left, .tap-right{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

.tap-left{ left:0; }
.tap-right{ right:0; }

/* ---------------------------------------------------------
   FINALMINDSET — MINIMAL COMMAND BAR
   --------------------------------------------------------- */

.brand-bar{
  position:absolute;
  top:3vh;
  left:4vw;
  padding:6px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);

  box-shadow:
    0 0 12px rgba(255,255,255,.04),
    inset 0 0 8px rgba(255,255,255,.03);

  opacity:.42;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>
<div class="particles"></div>
<div class="grid"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div class="brand-bar">FINALMINDSET</div>

<div id="slides"></div>

<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>

<div class="nav" id="navDots"></div>

<script>
/* ---------------------------------------------------------
   CATEGORY-LOCKED ENGINE — RESET + DISCIPLINE
   --------------------------------------------------------- */

const categories = {
  reset: {
    hooks: [
      "Reset your entire life in 14 days.",
      "Clear your head and stabilise your life in 7 days.",
      "Stop feeling lost in the next 24 hours.",
      "Reset your mind in the next 48 hours.",
      "Give yourself 10 days and your life won’t feel this chaotic."
    ],
    punches: [
      "Your brain is overloaded — that’s why you feel stuck.",
      "You’re drowning in inputs you never chose.",
      "Your life feels chaotic because your attention is scattered.",
      "You wake up reactive and the whole day collapses.",
      "You’re consuming more than you’re creating."
    ],
    tensions: [
      "Too many inputs, no direction.",
      "You can’t think clearly when your brain is in constant noise.",
      "Every new input pulls you further from yourself.",
      "You’ve normalised mental clutter as your baseline.",
      "You keep trying to fix your life without fixing your inputs."
    ],
    collapses: [
      "Cut 5 inputs → clarity returns instantly.",
      "Reduce what you consume → your life stabilises.",
      "Silence your feed for 48 hours → watch your mind reset.",
      "Protect your first hour → the rest of the day follows.",
      "Lower your inputs → your next move becomes obvious."
    ]
  },

  discipline: {
    hooks: [
      "Rebuild your discipline in 7 days.",
      "Become the person you keep promising to be in 30 days.",
      "Fix your discipline without relying on motivation.",
      "Stop betraying yourself every night.",
      "Stabilise your habits in the next 14 days."
    ],
    punches: [
      "Your environment is stronger than your willpower.",
      "You don’t have a discipline problem — you have a standards problem.",
      "You keep negotiating with yourself after the decision is made.",
      "You act like your future self is a stranger.",
      "You break more promises to yourself than to anyone else."
    ],
    tensions: [
      "You can’t grow in a space built for your old identity.",
      "Every time you break your word, your identity erodes.",
      "You say you want change, but your environment says otherwise.",
      "Your habits still belong to the person you’re trying to outgrow.",
      "You’re asking for a new life while living like the old one."
    ],
    collapses: [
      "Change the environment → the habits follow.",
      "Raise your standards → your actions have no choice but to follow.",
      "Decide once, act without negotiation.",
      "Act like your future self today → identity catches up.",
      "Treat your own word as law → discipline becomes automatic."
    ]
  }
};

/* Your original CTAs */
const ctas = [
  "If you’re serious, the link in my bio shows you how to run this properly.",
  "Save this and start today — the protocol is in my bio.",
  "If this exposed you, the next step is waiting in my bio.",
  "Run this for 30 days — the framework is in my bio.",
  "If you’re done looping, the real work starts in my bio."
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function pickCategory(){
  const keys = Object.keys(categories);
  const idx = Math.floor(Math.random()*keys.length);
  return categories[keys[idx]];
}

function buildSlides(){
  const cat = pickCategory();
  const hook = pick(cat.hooks);
  const punch = pick(cat.punches);
  const tension = pick(cat.tensions);
  const collapse = pick(cat.collapses);
  const cta = pick(ctas);

  return [
    { type:"pair", s1:hook, s2:"" },
    { type:"pair", s1:punch, s2:"" },
    { type:"pair", s1:tension, s2:"" },
    { type:"pair", s1:collapse, s2:"" },
    { type:"cta", text:cta }
  ];
}

/* Render engine */
const slidesContainer = document.getElementById("slides");
const navDots = document.getElementById("navDots");
let index = 0;
let currentSlides = buildSlides();

function render(){
  slidesContainer.innerHTML = "";
  navDots.innerHTML = "";

  currentSlides.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "slide" + (i===index ? " active" : "");

    if(s.type === "pair"){
      el.innerHTML = `
        <div class="s1">${s.s1}</div>
        ${s.s2 ? `<div class="s2">${s.s2}</div>` : ""}
      `;
    } else {
      el.innerHTML = `<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot = document.createElement("div");
    dot.className = "dot" + (i===index ? " active" : "");
    navDots.appendChild(dot);
  });
}

function next(){
  index = (index + 1) % currentSlides.length;
  render();
}

function prev(){
  index = (index - 1 + currentSlides.length) % currentSlides.length;
  render();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

render();
</script>

</body>
</html>
