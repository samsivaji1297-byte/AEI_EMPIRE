<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rapid-Fire 7 — FinalMindset</title>

<style>
/* ————————————————————————————————
   BASE AESTHETIC (IDENTICAL TO YOUR V3)
   ———————————————————————————————— */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;}

.bg{
  position:absolute;inset:-30%;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.08),transparent 60%),
    radial-gradient(circle at 80% 100%,rgba(255,255,255,.05),transparent 60%),
    linear-gradient(180deg,#020202,#000);
  filter:blur(90px);opacity:.9;
  animation:drift 32s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:scale(1);}to{transform:scale(1.3) translate(-80px,-120px);}}

/* Fog */
.fog{
  position:absolute;inset:-10%;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.05),transparent 55%),
    radial-gradient(circle at 90% 100%,rgba(255,255,255,.04),transparent 55%);
  mix-blend-mode:screen;opacity:.18;filter:blur(28px);
  animation:fogShift 40s ease-in-out infinite alternate;
}
@keyframes fogShift{from{transform:translate(-10px,10px);}to{transform:translate(20px,-20px) scale(1.12);}}

/* Particles */
.particles{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:3px 3px,5px 5px;opacity:.06;
  animation:particleDrift 60s linear infinite;
}
@keyframes particleDrift{from{transform:translate(0,0);}to{transform:translate(-120px,-80px);}}

/* Grid */
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;mix-blend-mode:overlay;opacity:.05;
  animation:gridPulse 14s ease-in-out infinite alternate;
}
@keyframes gridPulse{from{opacity:.03;}to{opacity:.08;}}

/* Overlay + Noise */
.overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent);
  backdrop-filter:blur(20px);
}
.noise{
  position:absolute;inset:0;opacity:.04;
  background-image:radial-gradient(circle,white 1px,transparent 1px);
  background-size:4px 4px;
}

/* ————————————————————————————————
   SLIDE SYSTEM
   ———————————————————————————————— */

.slide{
  position:absolute;inset:0;
  padding:0 9vw;padding-top:11vh;padding-bottom:11vh;
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;transform:translateY(32px);
  transition:opacity .65s ease,transform .65s ease;
}
.slide.active{opacity:1;transform:translateY(0);}

.s1{
  font-size:clamp(34px,7vw,78px);
  line-height:1.04;font-weight:700;letter-spacing:-1.2px;
  margin-bottom:18px;text-wrap:balance;
}

.s2{
  font-size:clamp(26px,5vw,42px);
  line-height:1.25;color:rgba(255,255,255,.82);
  max-width:92%;text-wrap:balance;
}

/* Inline bullet */
.bullet {
  font-size: 1.2em;
  margin-right: 14px;
  display: inline-block;
  transform: translateY(-2px);
}

/* CTA */
.cta{
  font-size:clamp(26px,6vw,42px);
  line-height:1.25;font-weight:600;color:#fff;
  max-width:90%;
}

/* Navigation */
.nav{
  position:absolute;bottom:5vh;left:0;right:0;
  display:flex;justify-content:center;gap:8px;z-index:10;
}
.dot{
  width:7px;height:7px;border-radius:999px;
  background:rgba(255,255,255,.25);transition:all .25s ease;
}
.dot.active{width:22px;background:#fff;}

.tap-left,.tap-right{
  position:absolute;top:0;bottom:0;width:50%;z-index:20;
}
.tap-left{left:0;} .tap-right{right:0;}

/* Brand bar */
.brand-bar{
  position:absolute;top:3vh;left:4vw;
  padding:6px 14px;font-size:11px;font-weight:500;
  letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);
  box-shadow:0 0 12px rgba(255,255,255,.04), inset 0 0 8px rgba(255,255,255,.03);
  opacity:.42;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>
<div class="particles"></div>
<div class="grid"></div>
<div class="overlay"></div>
<div class="noise"></div>

<div class="brand-bar">FINALMINDSET</div>

<div id="slides"></div>
<div class="tap-left" id="prev"></div>
<div class="tap-right" id="next"></div>
<div class="nav" id="navDots"></div>

<script>
/* ————————————————————————————————
   RAPID-FIRE 7 ENGINE (INLINE BULLET VERSION)
   ———————————————————————————————— */

const hooks = [
  "If you're stuck, read this twice.",
  "If life feels heavy, this will help.",
  "If you're tired of restarting, start here.",
  "If you want momentum, absorb this.",
  "If you feel behind, this is for you."
];

const bullets = [
  "Stop negotiating with yourself after the decision.",
  "Make your mornings boring — boredom builds discipline.",
  "Reduce your inputs so your brain can breathe.",
  "Do one thing your future self would thank you for.",
  "Replace scrolling with a 10-minute walk.",
  "Track actions, not emotions — proof beats feelings.",
  "Silence is a superpower — use it daily.",
  "Momentum is built, not found.",
  "Your environment is programming you — adjust it.",
  "Identity shifts happen through repetition, not intensity."
];

const ctas = [
  "If this hit, the real work starts in my bio.",
  "Save this — the next step is waiting in my bio.",
  "If you felt this, the framework is in my bio.",
  "Run this today — the protocol is in my bio.",
  "If this exposed you, the link in my bio is your next move."
];

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function pickDistinct(arr,count){
  const copy=[...arr]; const out=[];
  while(out.length<count && copy.length){
    const idx=Math.floor(Math.random()*copy.length);
    out.push(copy[idx]); copy.splice(idx,1);
  }
  return out;
}

function buildSlides(){
  const hook = pick(hooks);
  const lines = pickDistinct(bullets,5);
  const cta = pick(ctas);

  return [
    {type:"hook", text:hook},
    ...lines.map(l => ({type:"bullet", text:l})),
    {type:"cta", text:cta}
  ];
}

/* Render engine */
const slidesContainer=document.getElementById("slides");
const navDots=document.getElementById("navDots");
let index=0;
let currentSlides=buildSlides();

function render(){
  slidesContainer.innerHTML="";
  navDots.innerHTML="";

  currentSlides.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="slide"+(i===index?" active":"");

    if(s.type==="hook"){
      el.innerHTML = `<div class="s1">${s.text}</div>`;
    }
    else if(s.type==="bullet"){
      el.innerHTML = `
        <div class="s2">
          <span class="bullet">•</span>${s.text}
        </div>
      `;
    }
    else {
      el.innerHTML = `<div class="cta">${s.text}</div>`;
    }

    slidesContainer.appendChild(el);

    const dot=document.createElement("div");
    dot.className="dot"+(i===index?" active":"");
    navDots.appendChild(dot);
  });
}

function next(){index=(index+1)%currentSlides.length;render();}
function prev(){index=(index-1+currentSlides.length)%currentSlides.length;render();}

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

render();
</script>

</body>
</html>
